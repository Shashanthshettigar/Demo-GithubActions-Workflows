name: CD - Deploy to EKS

on:
  workflow_run:
    workflows:
      - CI - Build and Push to ECR
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download image metadata
        uses: actions/download-artifact@v4
        with:
          name: image-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read image metadata
        run: |
          cat image-metadata.txt
          source image-metadata.txt

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::066288112657:role/Github-actions-demo-payment-service
          aws-region: us-east-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region us-east-1 \
            --name demo-eks

      - name: Verify cluster access
        run: |
          kubectl get nodes

      - name: Deploy application
        run: |
          kubectl set image deployment/payment-service \
            payment-service=$IMAGE_URI

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/payment-service \
            --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get deployment payment-service
          kubectl get pods
          kubectl get service payment-service
